# Every value marked :? must be provided in a .env file next to this file.
# See .env.example for how to generate each one.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: espressolab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: espressolab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U espressolab -d espressolab"]
      interval: 10s
      timeout: 5s
      retries: 6
  api:
    build: .
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://espressolab:${POSTGRES_PASSWORD}@db:5432/espressolab
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      FERNET_KEY: ${FERNET_KEY:?Set FERNET_KEY in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env, for example https://attendance.example.com}
      ALLOW_SIMULATOR: "0"
      ENABLE_SCHEDULER: "1"
      FORCE_HTTPS: "0"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    volumes:
      - appdata:/data
      - "./back up:/back up"
    depends_on:
      db:
        condition: service_healthy
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
